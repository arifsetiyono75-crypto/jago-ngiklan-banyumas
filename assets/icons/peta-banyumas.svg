<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" role="img" aria-label="Peta Petualangan Belajar Budaya Banyumas">
  <defs>
    <!-- Gradasi Langit Pegunungan Banyumas -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="40%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>
    <!-- Gradasi Gunung Slamet Megah -->
    <linearGradient id="slametGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="45%" stop-color="#2563EB" />
      <stop offset="85%" stop-color="#059669" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <!-- Gradasi Bukit Pinus Baturraden -->
    <linearGradient id="baturradenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#166534" />
      <stop offset="60%" stop-color="#15803D" />
      <stop offset="100%" stop-color="#4ADE80" />
    </linearGradient>
    <!-- Gradasi Hamparan Sawah Subur -->
    <linearGradient id="sawahGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84CC16" />
      <stop offset="50%" stop-color="#A3E635" />
      <stop offset="100%" stop-color="#65A30D" />
    </linearGradient>
    <!-- Gradasi Sungai Serayu -->
    <linearGradient id="serayuGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <!-- Bayangan Lembut Kartun -->
    <filter id="softMapShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- 1. LANGIT & AWAN CERIA -->
  <rect width="960" height="260" fill="url(#skyGrad)" />
  <!-- Matahari Pagi Hangat di Balik Slamet -->
  <circle cx="580" cy="90" r="48" fill="#FDE047" opacity="0.85" filter="url(#softMapShadow)" />
  <circle cx="580" cy="90" r="64" fill="#FEF08A" opacity="0.35" />
  
  <!-- Gumpalan Awan Kartun -->
  <g fill="#FFFFFF" opacity="0.9">
    <ellipse cx="200" cy="65" rx="50" ry="22" />
    <ellipse cx="230" cy="55" rx="35" ry="24" />
    <ellipse cx="170" cy="68" rx="30" ry="18" />

    <ellipse cx="780" cy="75" rx="60" ry="24" />
    <ellipse cx="820" cy="65" rx="40" ry="26" />
    <ellipse cx="740" cy="78" rx="35" ry="20" />
  </g>

  <!-- 2. SILUET GUNUNG SLAMET (ATAP JAWA TENGAH 3.428 MDPL) -->
  <g id="gunung-slamet" filter="url(#softMapShadow)">
    <path d="M 280 260 L 480 60 Q 500 52 520 60 L 720 260 Z" fill="url(#slametGrad)" stroke="#1E293B" stroke-width="2.5" />
    <!-- Lereng Lembah Kawah -->
    <path d="M 480 60 Q 495 100 460 180 L 540 260 L 520 60 Z" fill="#1D4ED8" opacity="0.35" />
    <!-- Tutupan Kabut / Salju Putih Puncak Slamet -->
    <path d="M 465 76 Q 490 85 500 70 Q 515 85 535 76 L 500 54 Z" fill="#F8FAFC" opacity="0.9" />
    <path d="M 475 92 Q 495 102 510 90 L 500 68 Z" fill="#E2E8F0" opacity="0.6" />
  </g>

  <!-- 3. PERBUKITAN POHON PINUS & BATURRADEN -->
  <g id="lereng-baturraden">
    <!-- Bukit Kiri -->
    <path d="M 0 280 Q 180 170 380 270 L 380 340 L 0 340 Z" fill="url(#baturradenGrad)" stroke="#14532D" stroke-width="2" />
    <!-- Bukit Kanan -->
    <path d="M 620 280 Q 820 180 960 260 L 960 340 L 620 340 Z" fill="url(#baturradenGrad)" stroke="#14532D" stroke-width="2" />
    
    <!-- Air Terjun Curug Baturraden Mengalir -->
    <path d="M 260 220 Q 268 250 264 285 Q 262 305 270 325" stroke="#E0F2FE" stroke-width="7" fill="none" stroke-linecap="round" />
    <path d="M 261 220 Q 267 250 263 285 Q 261 305 269 325" stroke="#38BDF8" stroke-width="3" fill="none" stroke-linecap="round" />
    <ellipse cx="270" cy="326" rx="14" ry="6" fill="#BAE6FD" opacity="0.8" />

    <!-- Pepohonan Pinus Cemara Kartun -->
    <g fill="#14532D">
      <!-- Pohon Kiri -->
      <polygon points="120,220 110,245 130,245" />
      <polygon points="120,235 106,260 134,260" />
      <polygon points="150,230 142,250 158,250" />
      <polygon points="150,242 138,265 162,265" />
      <!-- Pohon Kanan -->
      <polygon points="800,210 790,235 810,235" />
      <polygon points="800,225 786,250 814,250" />
      <polygon points="840,225 832,245 848,245" />
      <polygon points="840,238 828,260 852,260" />
    </g>
  </g>

  <!-- 4. HAMBARAN SAWAH TERASERING & DATARAN BANYUMAS -->
  <g id="dataran-sawah">
    <path d="M 0 320 Q 480 300 960 320 L 960 540 L 0 540 Z" fill="url(#sawahGrad)" />
    <!-- Terasering Petak Sawah Bergaris -->
    <path d="M 0 350 Q 260 335 480 355 Q 740 340 960 360" stroke="#4D7C0F" stroke-width="2.5" fill="none" />
    <path d="M 0 395 Q 240 380 500 405 Q 760 390 960 410" stroke="#4D7C0F" stroke-width="2.5" fill="none" />
    <path d="M 0 450 Q 260 435 520 460 Q 760 445 960 465" stroke="#4D7C0F" stroke-width="2.5" fill="none" />

    <!-- Pohon Kelapa Penderes Gula Kelapa Khas Banyumas -->
    <g transform="translate(680, 310)">
      <path d="M 12 50 Q 20 25 14 0" stroke="#78350F" stroke-width="3.5" fill="none" stroke-linecap="round" />
      <path d="M 14 0 Q 0 -10 -15 -5" stroke="#15803D" stroke-width="3" fill="none" stroke-linecap="round" />
      <path d="M 14 0 Q 30 -12 40 -5" stroke="#15803D" stroke-width="3" fill="none" stroke-linecap="round" />
      <path d="M 14 0 Q 15 -22 14 -28" stroke="#16A34A" stroke-width="3" fill="none" stroke-linecap="round" />
    </g>
  </g>

  <!-- 5. ALIRAN SUNGAI SERAYU YANG BERKELOK ANGGUN -->
  <g id="sungai-serayu" filter="url(#softMapShadow)">
    <path d="M 0 470 C 180 430 320 490 520 450 C 700 410 840 470 960 440 L 960 495 C 840 525 700 465 520 505 C 320 545 180 485 0 525 Z" fill="url(#serayuGrad)" stroke="#0369A1" stroke-width="2.5" />
    <!-- Riak Air Putih Sungai -->
    <path d="M 80 485 Q 160 470 240 488" stroke="#E0F2FE" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M 380 475 Q 460 460 540 478" stroke="#E0F2FE" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M 680 448 Q 760 435 840 455" stroke="#E0F2FE" stroke-width="2" fill="none" stroke-linecap="round" />
    <!-- Perahu Nelayan Tradisional di Serayu -->
    <path d="M 440 470 Q 455 476 470 470 L 466 466 L 444 466 Z" fill="#78350F" stroke="#451A03" stroke-width="1.2" />
    <line x1="455" y1="466" x2="455" y2="456" stroke="#451A03" stroke-width="1.5" />
    <polygon points="455,456 465,461 455,465" fill="#EF4444" />
  </g>

  <!-- 6. JALUR PETUALANGAN EMAS (WINDING ADVENTURE TRAIL) -->
  <path d="M 120 410 Q 240 370 320 380 T 520 370 T 700 310 T 820 330" fill="none" stroke="#F59E0B" stroke-width="6" stroke-dasharray="10,8" stroke-linecap="round" filter="url(#softMapShadow)" />
  <path d="M 120 410 Q 240 370 320 380 T 520 370 T 700 310 T 820 330" fill="none" stroke="#FEF3C7" stroke-width="2.5" stroke-dasharray="10,8" stroke-linecap="round" />

  <!-- 7. SIMBOL LOKASI BUDAYA & IKONIS -->
  <!-- Balai / Pendopo Alun-Alun Purwokerto (Dekat Pos 1) -->
  <g transform="translate(100, 370)">
    <path d="M 0 20 L 20 5 L 40 20 Z" fill="#991B1B" stroke="#450A0A" stroke-width="1.5" />
    <rect x="6" y="20" width="28" height="15" fill="#FEF3C7" stroke="#78350F" stroke-width="1.2" />
    <line x1="12" y1="20" x2="12" y2="35" stroke="#78350F" stroke-width="1.5" />
    <line x1="28" y1="20" x2="28" y2="35" stroke="#78350F" stroke-width="1.5" />
  </g>

  <!-- Sentra Batik Sokaraja & Anyaman Besek Getuk (Dekat Pos 2) -->
  <g transform="translate(305, 340)">
    <rect x="0" y="8" width="30" height="22" rx="4" fill="#5C3A21" stroke="#F59E0B" stroke-width="1.5" />
    <text x="15" y="23" font-size="12" text-anchor="middle">🏺</text>
  </g>

  <!-- Jembatan Serayu / Pos Literasi (Dekat Pos 3) -->
  <g transform="translate(505, 335)">
    <rect x="0" y="8" width="30" height="22" rx="4" fill="#1E3A8A" stroke="#60A5FA" stroke-width="1.5" />
    <text x="15" y="23" font-size="12" text-anchor="middle">🎯</text>
  </g>

  <!-- Gazebo Kreatif Baturraden (Dekat Pos 4) -->
  <g transform="translate(685, 275)">
    <polygon points="15,0 0,14 30,14" fill="#D97706" stroke="#78350F" stroke-width="1.5" />
    <rect x="4" y="14" width="22" height="14" fill="#FFFBEB" stroke="#78350F" stroke-width="1.2" />
    <text x="15" y="25" font-size="10" text-anchor="middle">🎨</text>
  </g>

  <!-- Menara / Puncak Apresiasi Duta Banyumas (Dekat Pos 5) -->
  <g transform="translate(805, 290)">
    <polygon points="15,0 5,26 25,26" fill="#F59E0B" stroke="#78350F" stroke-width="1.8" />
    <circle cx="15" cy="0" r="4" fill="#EF4444" />
    <text x="15" y="22" font-size="11" text-anchor="middle">🏆</text>
  </g>

  <!-- KANG BAWOR KECIL MENYAPA DI SUDUT KIRI PETA -->
  <g transform="translate(30, 290) scale(0.65)" filter="url(#softMapShadow)">
    <ellipse cx="60" cy="90" rx="35" ry="30" fill="#FCD29F" stroke="#3A1E0D" stroke-width="2.5" />
    <ellipse cx="60" cy="50" rx="36" ry="32" fill="#F5B888" stroke="#3A1E0D" stroke-width="2.5" />
    <ellipse cx="45" cy="46" rx="8" ry="9" fill="#FFF" stroke="#3A1E0D" stroke-width="2" />
    <circle cx="46" cy="46" r="4.5" fill="#2E170A" />
    <ellipse cx="75" cy="46" rx="8" ry="9" fill="#FFF" stroke="#3A1E0D" stroke-width="2" />
    <circle cx="74" cy="46" r="4.5" fill="#2E170A" />
    <path d="M 44 60 Q 60 76 76 60" stroke="#991B1B" stroke-width="3" fill="#991B1B" />
    <path d="M 28 32 Q 60 16 92 32" fill="#5C3A21" stroke="#3A1E0D" stroke-width="2.5" />
    <path d="M 58 18 C 54 6 62 -2 68 2 C 72 4 70 12 62 18 Z" fill="#1C1008" />
    <!-- Balon Sapaan Mini -->
    <rect x="80" y="0" width="130" height="34" rx="8" fill="#FFFBEB" stroke="#5C3A21" stroke-width="1.8" />
    <text x="145" y="16" font-family="'Poppins', sans-serif" font-weight="800" font-size="10" fill="#5C3A21" text-anchor="middle">Peta Petualangan!</text>
    <text x="145" y="27" font-family="'Nunito', sans-serif" font-weight="700" font-size="8.5" fill="#B45309" text-anchor="middle">Peta Budaya Banyumas</text>
  </g>

  <!-- NAMA-NAMA WILAYAH DI PETA (TIPOGRAFI ESTETIS) -->
  <g font-family="'Poppins', sans-serif" font-weight="900" text-shadow="0 1px 3px rgba(0,0,0,0.6)">
    <text x="500" y="44" font-size="13" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">GUNUNG SLAMET (3.428 MDPL)</text>
    <text x="210" y="215" font-size="11" fill="#FEF08A" text-anchor="middle" letter-spacing="1">🌲 BATURRADEN</text>
    <text x="120" y="365" font-size="11" fill="#FFFFFF" text-anchor="middle">KOTA PURWOKERTO</text>
    <text x="320" y="335" font-size="11" fill="#FFFFFF" text-anchor="middle">SENTRA SOKARAJA</text>
    <text x="520" y="525" font-size="12" fill="#E0F2FE" text-anchor="middle" letter-spacing="3">SUNGAI SERAYU</text>
  </g>
</svg>
