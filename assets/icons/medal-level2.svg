<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100%" height="100%" role="img" aria-label="Medali Sahabat Kang Bawor">
  <defs>
    <linearGradient id="ribbonGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <radialGradient id="silverGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#E2E8F0" />
      <stop offset="70%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </radialGradient>
    <filter id="medalGlow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#1E293B" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#medalGlow2)">
    <path d="M 28 0 L 50 38 L 40 40 L 18 0 Z" fill="url(#ribbonGrad2)" stroke="#1E293B" stroke-width="1.5" />
    <path d="M 72 0 L 50 38 L 60 40 L 82 0 Z" fill="url(#ribbonGrad2)" stroke="#1E293B" stroke-width="1.5" />
    <path d="M 46 0 L 50 20 L 54 0 Z" fill="#93C5FD" />

    <circle cx="50" cy="38" r="7" fill="none" stroke="#CBD5E1" stroke-width="3" />

    <circle cx="50" cy="74" r="36" fill="url(#silverGrad)" stroke="#334155" stroke-width="2.5" />
    <circle cx="50" cy="74" r="30" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="4,2" />
    <circle cx="50" cy="74" r="26" fill="#64748B" stroke="#1E293B" stroke-width="1.2" />

    <!-- Siluet Profil Kepala & Kuncung Kang Bawor -->
    <ellipse cx="50" cy="76" rx="14" ry="12" fill="#F1F5F9" />
    <circle cx="45" cy="74" r="2.5" fill="#1E293B" />
    <path d="M 43 80 Q 50 86 57 80" stroke="#1E293B" stroke-width="2" fill="none" stroke-linecap="round" />
    <!-- Udeng & Kuncung -->
    <path d="M 37 68 Q 50 62 63 68" stroke="#334155" stroke-width="3.5" fill="none" stroke-linecap="round" />
    <path d="M 50 63 C 48 55 54 50 56 52 C 58 54 56 58 53 63 Z" fill="#1E293B" />

    <!-- Kilau Bintang Perak -->
    <polygon points="32,54 34,58 38,58 35,61 36,65 32,62 28,65 29,61 26,58 30,58" fill="#FFFFFF" opacity="0.9" />
    <polygon points="68,84 69,87 72,87 70,89 71,92 68,90 65,92 66,89 64,87 67,87" fill="#FFFFFF" opacity="0.7" />
  </g>
</svg>
