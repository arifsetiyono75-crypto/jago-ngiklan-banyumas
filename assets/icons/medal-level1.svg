<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100%" height="100%" role="img" aria-label="Medali Santri Sinau">
  <defs>
    <!-- Gradasi Pita Merah-Emas -->
    <linearGradient id="ribbonGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991B1B" />
      <stop offset="50%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#7F1D1D" />
    </linearGradient>
    <!-- Gradasi Medali Perunggu Berkilau -->
    <radialGradient id="bronzeGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FED7AA" />
      <stop offset="30%" stop-color="#FB923C" />
      <stop offset="70%" stop-color="#C2410C" />
      <stop offset="100%" stop-color="#7C2D12" />
    </radialGradient>
    <filter id="medalGlow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#7C2D12" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#medalGlow1)">
    <!-- Pita Gantung Medali -->
    <path d="M 28 0 L 50 38 L 40 40 L 18 0 Z" fill="url(#ribbonGrad1)" stroke="#5C3A21" stroke-width="1.5" />
    <path d="M 72 0 L 50 38 L 60 40 L 82 0 Z" fill="url(#ribbonGrad1)" stroke="#5C3A21" stroke-width="1.5" />
    <path d="M 46 0 L 50 20 L 54 0 Z" fill="#FDE68A" />

    <!-- Cincin Gantung Logam -->
    <circle cx="50" cy="38" r="7" fill="none" stroke="#D97706" stroke-width="3" />

    <!-- Medali Lingkaran Berelief -->
    <circle cx="50" cy="74" r="36" fill="url(#bronzeGrad)" stroke="#5C3A21" stroke-width="2.5" />
    <circle cx="50" cy="74" r="30" fill="none" stroke="#FED7AA" stroke-width="1.5" stroke-dasharray="4,2" />
    <circle cx="50" cy="74" r="26" fill="#9A3412" stroke="#431407" stroke-width="1.2" />

    <!-- Ikon Buku Terbuka & Tunas Daun (Belajar Tekun) -->
    <path d="M 38 68 Q 50 63 50 78 Q 50 63 62 68 L 62 82 Q 50 77 50 86 Q 50 77 38 82 Z" fill="#FED7AA" stroke="#431407" stroke-width="1.5" />
    <path d="M 50 62 Q 54 54 50 50 Q 46 54 50 62 Z" fill="#FDE68A" />

    <!-- Kilau Bintang Cahaya Emas -->
    <polygon points="32,54 34,58 38,58 35,61 36,65 32,62 28,65 29,61 26,58 30,58" fill="#FFFFFF" opacity="0.85" />
  </g>
</svg>
