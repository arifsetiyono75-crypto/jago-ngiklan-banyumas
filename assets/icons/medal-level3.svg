<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100%" height="100%" role="img" aria-label="Medali Pendekar Slogan">
  <defs>
    <linearGradient id="ribbonGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14532D" />
      <stop offset="50%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#052E16" />
    </linearGradient>
    <radialGradient id="goldMedalGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#FDE68A" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </radialGradient>
    <filter id="medalGlow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#78350F" flood-opacity="0.4" />
    </filter>
  </defs>

  <g filter="url(#medalGlow3)">
    <path d="M 28 0 L 50 38 L 40 40 L 18 0 Z" fill="url(#ribbonGrad3)" stroke="#14532D" stroke-width="1.5" />
    <path d="M 72 0 L 50 38 L 60 40 L 82 0 Z" fill="url(#ribbonGrad3)" stroke="#14532D" stroke-width="1.5" />
    <path d="M 46 0 L 50 20 L 54 0 Z" fill="#FDE68A" />

    <circle cx="50" cy="38" r="7" fill="none" stroke="#F59E0B" stroke-width="3" />

    <circle cx="50" cy="74" r="36" fill="url(#goldMedalGrad)" stroke="#78350F" stroke-width="2.5" />
    <circle cx="50" cy="74" r="30" fill="none" stroke="#FFFBEB" stroke-width="1.8" stroke-dasharray="4,2" />
    <circle cx="50" cy="74" r="26" fill="#D97706" stroke="#78350F" stroke-width="1.2" />

    <!-- Bintang Penghargaan Emas 3D -->
    <polygon points="50,56 54,66 65,66 56,73 60,84 50,77 40,84 44,73 35,66 46,66" fill="#FEF3C7" stroke="#78350F" stroke-width="1.5" />
    <!-- Kilau Tengah Bintang -->
    <polygon points="50,60 52,66 58,66 53,70 55,76 50,72 45,76 47,70 42,66 48,66" fill="#F59E0B" />

    <polygon points="30,52 33,57 38,57 34,60 36,65 30,62 25,65 27,60 22,57 28,57" fill="#FFFFFF" opacity="0.95" />
