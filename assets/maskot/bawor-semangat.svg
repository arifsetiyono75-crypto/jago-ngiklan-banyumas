<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="100%" height="100%" role="img" aria-label="Kang Bawor Semangat">
  <defs>
    <radialGradient id="baworSkin3" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFDEB5" />
      <stop offset="60%" stop-color="#F5B888" />
      <stop offset="100%" stop-color="#D98A52" />
    </radialGradient>
    <radialGradient id="baworBelly3" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FCD29F" />
      <stop offset="70%" stop-color="#EAA26A" />
      <stop offset="100%" stop-color="#C27339" />
    </radialGradient>
    <linearGradient id="udengBawor3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5C3A21" />
      <stop offset="50%" stop-color="#784719" />
      <stop offset="100%" stop-color="#3A1E0D" />
    </linearGradient>
    <linearGradient id="goldTrim3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="baworShadow3" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#3A1E0D" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#baworShadow3)">
    <!-- BAYANGAN TANAH -->
    <ellipse cx="100" cy="208" rx="55" ry="8" fill="#3A1E0D" opacity="0.2" />

    <!-- KAKI JARIK -->
    <ellipse cx="80" cy="198" rx="14" ry="9" fill="url(#baworSkin3)" stroke="#3A1E0D" stroke-width="2.5" />
    <ellipse cx="120" cy="198" rx="14" ry="9" fill="url(#baworSkin3)" stroke="#3A1E0D" stroke-width="2.5" />
    <circle cx="73" cy="200" r="3" fill="#D98A52" />
    <circle cx="127" cy="200" r="3" fill="#D98A52" />

    <path d="M 64 150 Q 100 156 136 150 L 140 190 Q 100 200 60 190 Z" fill="url(#udengBawor3)" stroke="#3A1E0D" stroke-width="2.5" />
    <path d="M 72 160 Q 90 172 82 188" stroke="url(#goldTrim3)" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M 96 158 Q 112 170 102 189" stroke="url(#goldTrim3)" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M 120 162 Q 134 174 126 188" stroke="url(#goldTrim3)" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M 64 150 Q 100 156 136 150 L 136 158 Q 100 164 64 158 Z" fill="url(#goldTrim3)" stroke="#3A1E0D" stroke-width="2" />
    <circle cx="100" cy="157" r="5" fill="#EF4444" stroke="#78350F" stroke-width="1.5" />

    <!-- BADAN GEMUK -->
    <ellipse cx="100" cy="138" rx="42" ry="34" fill="url(#baworBelly3)" stroke="#3A1E0D" stroke-width="3" />
    <ellipse cx="100" cy="144" rx="3.5" ry="2.5" fill="#A85724" />

    <!-- ROMPI KAIN SOGA -->
    <path d="M 64 116 Q 78 132 72 152 Q 62 142 60 126 Z" fill="url(#udengBawor3)" stroke="#3A1E0D" stroke-width="2" />
    <path d="M 136 116 Q 122 132 128 152 Q 138 142 140 126 Z" fill="url(#udengBawor3)" stroke="#3A1E0D" stroke-width="2" />

    <!-- DUA TANGAN MENGEPAL KE ATAS (GESTUR SEMANGAT TINGGI) -->
    <!-- Tangan Kiri Mengepal -->
    <g id="tangan-kiri-kepal">
      <path d="M 62 122 Q 42 108 46 88 Q 56 86 64 100" stroke="#3A1E0D" stroke-width="8" stroke-linecap="round" fill="none" />
      <path d="M 62 122 Q 42 108 46 88 Q 56 86 64 100" stroke="url(#baworSkin3)" stroke-width="5" stroke-linecap="round" fill="none" />
      <!-- Kepalan Kiri -->
      <circle cx="46" cy="84" r="9" fill="url(#baworSkin3)" stroke="#3A1E0D" stroke-width="2.5" />
      <path d="M 40 84 Q 46 80 52 84" stroke="#3A1E0D" stroke-width="2" fill="none" />
    </g>

    <!-- Tangan Kanan Mengepal -->
    <g id="tangan-kanan-kepal">
      <path d="M 138 122 Q 158 108 154 88 Q 144 86 136 100" stroke="#3A1E0D" stroke-width="8" stroke-linecap="round" fill="none" />
      <path d="M 138 122 Q 158 108 154 88 Q 144 86 136 100" stroke="url(#baworSkin3)" stroke-width="5" stroke-linecap="round" fill="none" />
      <!-- Kepalan Kanan -->
      <circle cx="154" cy="84" r="9" fill="url(#baworSkin3)" stroke="#3A1E0D" stroke-width="2.5" />
      <path d="M 148 84 Q 154 80 160 84" stroke="#3A1E0D" stroke-width="2" fill="none" />
    </g>

    <!-- LEHER & KALUNG -->
    <rect x="88" y="104" width="24" height="12" rx="6" fill="url(#baworSkin3)" />
    <path d="M 80 110 Q 100 120 120 110" stroke="url(#goldTrim3)" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- KEPALA & WAJAH -->
    <ellipse cx="100" cy="74" rx="44" ry="40" fill="url(#baworSkin3)" stroke="#3A1E0D" stroke-width="3" />

    <!-- PIPI -->
    <ellipse cx="68" cy="85" rx="9" ry="6" fill="#F87171" opacity="0.65" />
    <ellipse cx="132" cy="85" rx="9" ry="6" fill="#F87171" opacity="0.65" />

    <!-- TELINGA & ANTING -->
    <ellipse cx="56" cy="74" rx="7" ry="10" fill="url(#baworSkin3)" stroke="#3A1E0D" stroke-width="2.5" />
    <circle cx="56" cy="81" r="3.5" fill="url(#goldTrim3)" stroke="#3A1E0D" stroke-width="1.2" />
    <ellipse cx="144" cy="74" rx="7" ry="10" fill="url(#baworSkin3)" stroke="#3A1E0D" stroke-width="2.5" />
    <circle cx="144" cy="81" r="3.5" fill="url(#goldTrim3)" stroke="#3A1E0D" stroke-width="1.2" />

    <!-- MATA SEMANGAT BERBINAR -->
    <!-- Mata Kiri -->
    <ellipse cx="80" cy="66" rx="10" ry="11" fill="#FFFFFF" stroke="#3A1E0D" stroke-width="2.5" />
    <circle cx="80" cy="66" r="6" fill="#2E170A" />
    <circle cx="78" cy="63" r="2.8" fill="#FFFFFF" />
    <polygon points="80,59 82,63 86,63 83,66 84,70 80,67 76,70 77,66 74,63 78,63" fill="#FDE68A" opacity="0.8" />
    <path d="M 68 52 Q 80 46 92 50" stroke="#3A1E0D" stroke-width="3.5" stroke-linecap="round" fill="none" />

    <!-- Mata Kanan -->
    <ellipse cx="120" cy="66" rx="10" ry="11" fill="#FFFFFF" stroke="#3A1E0D" stroke-width="2.5" />
    <circle cx="120" cy="66" r="6" fill="#2E170A" />
    <circle cx="118" cy="63" r="2.8" fill="#FFFFFF" />
    <polygon points="120,59 122,63 126,63 123,66 124,70 120,67 116,70 117,66 114,63 118,63" fill="#FDE68A" opacity="0.8" />
    <path d="M 108 50 Q 120 46 132 52" stroke="#3A1E0D" stroke-width="3.5" stroke-linecap="round" fill="none" />

    <!-- HIDUNG -->
    <path d="M 94 72 C 94 65 106 65 106 72 C 106 79 94 79 94 72 Z" fill="#E89658" stroke="#3A1E0D" stroke-width="2.2" />
    <ellipse cx="98" cy="70" rx="2" ry="1.2" fill="#FFFFFF" opacity="0.6" />

    <!-- SENYUM LEBAR TERIAKAN SEMANGAT ("TETAP SEMANGAT!") -->
    <path d="M 76 83 Q 100 112 124 83 Q 100 88 76 83 Z" fill="#991B1B" stroke="#3A1E0D" stroke-width="2.5" />
    <path d="M 83 84 Q 100 89 117 84 Q 100 87 83 84 Z" fill="#FFFFFF" />
    <path d="M 88 98 Q 100 90 112 98 Q 100 108 88 98 Z" fill="#F43F5E" />

    <!-- UDENG & RAMBUT KUNCUNG -->
    <path d="M 58 50 Q 100 32 142 50 Q 146 60 138 60 Q 100 42 62 60 Q 54 60 58 50 Z" fill="url(#udengBawor3)" stroke="#3A1E0D" stroke-width="2.5" />
    <circle cx="144" cy="52" r="9" fill="#3A1E0D" />
    <path d="M 70 48 Q 100 38 130 48" stroke="url(#goldTrim3)" stroke-width="2.2" fill="none" stroke-dasharray="3,2" />
    <polygon points="96,38 104,38 102,46 98,46" fill="#FDE68A" stroke="#3A1E0D" stroke-width="1.2" />

    <path d="M 96 36 C 92 20 104 10 112 14 C 118 17 114 26 104 36 Z" fill="#1C1008" stroke="#3A1E0D" stroke-width="2.2" />
    <path d="M 100 28 Q 106 18 110 20" stroke="#784719" stroke-width="1.5" fill="none" stroke-linecap="round" />

    <!-- KILATAN SEMANGAT KARTUN -->
    <path d="M 34 68 L 26 72 L 32 76" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M 166 68 L 174 72 L 168 76" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" fill="none" />
  </g>
</svg>
