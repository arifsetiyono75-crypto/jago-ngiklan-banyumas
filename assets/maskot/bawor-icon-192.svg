  <path d="M 52 64 Q 96 44 140 64 Q 144 74 136 74 Q 96 56 56 74 Z" fill="url(#udeng192)" stroke="#3A1E0D" stroke-width="2.6" />
  <circle cx="142" cy="65" r="9" fill="#2D1508" />
  <path d="M 66 61 Q 96 50 126 61" stroke="#F59E0B" stroke-width="2.2" fill="none" stroke-dasharray="3,2" />

  <!-- Rambut Kuncung Khas -->
  <path d="M 92 48 C 88 32 100 22 108 26 C 114 29 110 38 100 48 Z" fill="#1C1008" stroke="#3A1E0D" stroke-width="2.2" />

  <!-- Pita Banner Judul Bawah -->
  <rect x="36" y="156" width="120" height="22" rx="11" fill="#5C3A21" stroke="#F59E0B" stroke-width="1.8" />
  <text x="96" y="171" font-family="'Poppins', sans-serif" font-weight="900" font-size="9" fill="#FFFBEB" text-anchor="middle" letter-spacing="1">KANG BAWOR</text>
</svg>
