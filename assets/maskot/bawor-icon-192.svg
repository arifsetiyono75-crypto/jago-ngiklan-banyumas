  <ellipse cx="96" cy="88" rx="46" ry="42" fill="url(#baworSkin192)" stroke="#3A1E0D" stroke-width="3.2" />

  <!-- Pipi Merona -->
  <ellipse cx="64" cy="98" rx="10" ry="7" fill="#F87171" opacity="0.65" />
  <ellipse cx="128" cy="98" rx="10" ry="7" fill="#F87171" opacity="0.65" />

  <!-- Telinga & Anting -->
  <ellipse cx="50" cy="88" rx="7" ry="10" fill="url(#baworSkin192)" stroke="#3A1E0D" stroke-width="2.5" />
  <circle cx="50" cy="95" r="3.5" fill="#F59E0B" stroke="#3A1E0D" stroke-width="1.2" />
  <ellipse cx="142" cy="88" rx="7" ry="10" fill="url(#baworSkin192)" stroke="#3A1E0D" stroke-width="2.5" />
  <circle cx="142" cy="95" r="3.5" fill="#F59E0B" stroke="#3A1E0D" stroke-width="1.2" />

  <!-- Mata Bulat Ceria -->
  <ellipse cx="76" cy="80" rx="10.5" ry="12" fill="#FFFFFF" stroke="#3A1E0D" stroke-width="2.5" />
  <circle cx="78" cy="80" r="6.5" fill="#2E170A" />
  <circle cx="76" cy="77" r="2.8" fill="#FFFFFF" />

  <ellipse cx="116" cy="80" rx="10.5" ry="12" fill="#FFFFFF" stroke="#3A1E0D" stroke-width="2.5" />
  <circle cx="114" cy="80" r="6.5" fill="#2E170A" />
  <circle cx="112" cy="77" r="2.8" fill="#FFFFFF" />

