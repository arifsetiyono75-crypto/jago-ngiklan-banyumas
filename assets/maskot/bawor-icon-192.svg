  <path d="M 72 98 Q 96 124 120 98 Q 96 104 72 98 Z" fill="#991B1B" stroke="#3A1E0D" stroke-width="2.6" />
  <path d="M 79 99 Q 96 104 113 99 Q 96 102 79 99 Z" fill="#FFFFFF" />
  <path d="M 86 112 Q 96 106 106 112 Q 96 120 86 112 Z" fill="#F43F5E" />

