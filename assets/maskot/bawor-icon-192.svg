<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="100%" height="100%" role="img" aria-label="Jago Ngiklan Banyumas - Kang Bawor 192px">
  <defs>
    <radialGradient id="iconBg192" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="70%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </radialGradient>
    <linearGradient id="iconRim192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#5C3A21" />
      <stop offset="100%" stop-color="#2D1508" />
    </linearGradient>
    <radialGradient id="baworSkin192" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFDEB5" />
      <stop offset="60%" stop-color="#F5B888" />
      <stop offset="100%" stop-color="#D98A52" />
    </radialGradient>
    <linearGradient id="udeng192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5C3A21" />
      <stop offset="100%" stop-color="#2D1508" />
    </linearGradient>
  </defs>

  <!-- Latar Belakang Lingkaran Maskot PWA Berbingkai Batik Emas -->
  <rect width="192" height="192" rx="42" fill="url(#iconRim192)" />
  <circle cx="96" cy="96" r="82" fill="url(#iconBg192)" stroke="#F59E0B" stroke-width="3" />

  <!-- Ornamen Sudut Tradisional -->
  <circle cx="28" cy="28" r="4" fill="#F59E0B" />
  <circle cx="164" cy="28" r="4" fill="#F59E0B" />
  <circle cx="28" cy="164" r="4" fill="#F59E0B" />
  <circle cx="164" cy="164" r="4" fill="#F59E0B" />

  <!-- Tubuh Bagian Atas & Rompi -->
  <ellipse cx="96" cy="148" rx="48" ry="34" fill="#FCD29F" stroke="#3A1E0D" stroke-width="3" />
  <path d="M 54 126 Q 70 144 64 168 Q 50 156 48 136 Z" fill="url(#udeng192)" stroke="#3A1E0D" stroke-width="2.5" />
  <path d="M 138 126 Q 122 144 128 168 Q 142 156 144 136 Z" fill="url(#udeng192)" stroke="#3A1E0D" stroke-width="2.5" />
  <path d="M 74 120 Q 96 132 118 120" stroke="#F59E0B" stroke-width="3" fill="none" stroke-linecap="round" />

