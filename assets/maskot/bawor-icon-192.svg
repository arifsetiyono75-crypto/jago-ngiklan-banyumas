  <path d="M 64 68 Q 76 62 88 68" stroke="#3A1E0D" stroke-width="3.2" stroke-linecap="round" fill="none" />
  <path d="M 104 68 Q 116 62 128 68" stroke="#3A1E0D" stroke-width="3.2" stroke-linecap="round" fill="none" />

  <!-- Hidung Bulat Khas Bawor -->
  <path d="M 90 86 C 90 79 102 79 102 86 C 102 93 90 93 90 86 Z" fill="#E89658" stroke="#3A1E0D" stroke-width="2.4" />

