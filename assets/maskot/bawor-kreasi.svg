<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="100%" height="100%" role="img" aria-label="Kang Bawor Berkreasi">
  <defs>
    <radialGradient id="baworSkin4" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFDEB5" />
      <stop offset="60%" stop-color="#F5B888" />
      <stop offset="100%" stop-color="#D98A52" />
    </radialGradient>
    <radialGradient id="baworBelly4" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FCD29F" />
      <stop offset="70%" stop-color="#EAA26A" />
      <stop offset="100%" stop-color="#C27339" />
    </radialGradient>
    <linearGradient id="udengBawor4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5C3A21" />
      <stop offset="50%" stop-color="#784719" />
      <stop offset="100%" stop-color="#3A1E0D" />
    </linearGradient>
    <linearGradient id="goldTrim4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="baworShadow4" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#3A1E0D" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#baworShadow4)">
    <!-- BAYANGAN TANAH -->
    <ellipse cx="100" cy="208" rx="55" ry="8" fill="#3A1E0D" opacity="0.2" />

    <!-- KAKI JARIK -->
    <ellipse cx="80" cy="198" rx="14" ry="9" fill="url(#baworSkin4)" stroke="#3A1E0D" stroke-width="2.5" />
    <ellipse cx="120" cy="198" rx="14" ry="9" fill="url(#baworSkin4)" stroke="#3A1E0D" stroke-width="2.5" />
    <circle cx="73" cy="200" r="3" fill="#D98A52" />
    <circle cx="127" cy="200" r="3" fill="#D98A52" />

    <path d="M 64 150 Q 100 156 136 150 L 140 190 Q 100 200 60 190 Z" fill="url(#udengBawor4)" stroke="#3A1E0D" stroke-width="2.5" />
    <path d="M 72 160 Q 90 172 82 188" stroke="url(#goldTrim4)" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M 96 158 Q 112 170 102 189" stroke="url(#goldTrim4)" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M 120 162 Q 134 174 126 188" stroke="url(#goldTrim4)" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M 64 150 Q 100 156 136 150 L 136 158 Q 100 164 64 158 Z" fill="url(#goldTrim4)" stroke="#3A1E0D" stroke-width="2" />
    <circle cx="100" cy="157" r="5" fill="#EF4444" stroke="#78350F" stroke-width="1.5" />

    <!-- BADAN GEMUK -->
    <ellipse cx="100" cy="138" rx="42" ry="34" fill="url(#baworBelly4)" stroke="#3A1E0D" stroke-width="3" />
    <ellipse cx="100" cy="144" rx="3.5" ry="2.5" fill="#A85724" />

    <!-- ROMPI KAIN SOGA -->
    <path d="M 64 116 Q 78 132 72 152 Q 62 142 60 126 Z" fill="url(#udengBawor4)" stroke="#3A1E0D" stroke-width="2" />
    <path d="M 136 116 Q 122 132 128 152 Q 138 142 140 126 Z" fill="url(#udengBawor4)" stroke="#3A1E0D" stroke-width="2" />

    <!-- TANGAN KIRI MEMEGANG PALET CAT SENI -->
    <g id="tangan-palet">
      <path d="M 62 122 Q 40 134 46 154" stroke="#3A1E0D" stroke-width="8" stroke-linecap="round" fill="none" />
      <path d="M 62 122 Q 40 134 46 154" stroke="url(#baworSkin4)" stroke-width="5" stroke-linecap="round" fill="none" />
      <!-- Palet Kayu Oval -->
      <ellipse cx="38" cy="152" rx="18" ry="12" fill="#D97706" stroke="#3A1E0D" stroke-width="2" transform="rotate(-15 38 152)" />
      <circle cx="48" cy="154" r="3" fill="#FDFBF7" stroke="#3A1E0D" stroke-width="1.2" /> <!-- Lubang Jempol -->
      <!-- Titik-Titik Cat Berwarna -->
      <circle cx="28" cy="148" r="3" fill="#EF4444" />
      <circle cx="34" cy="143" r="3" fill="#FBBF24" />
      <circle cx="42" cy="144" r="3" fill="#10B981" />
      <circle cx="34" cy="158" r="3" fill="#3B82F6" />
    </g>

    <!-- TANGAN KANAN MENGANGKAT KUAS LUKIS BESAR -->
    <g id="tangan-kuas">
      <path d="M 138 122 Q 164 116 160 92 Q 150 88 142 102" stroke="#3A1E0D" stroke-width="8" stroke-linecap="round" fill="none" />
      <path d="M 138 122 Q 164 116 160 92 Q 150 88 142 102" stroke="url(#baworSkin4)" stroke-width="5" stroke-linecap="round" fill="none" />
      <circle cx="160" cy="88" r="8" fill="url(#baworSkin4)" stroke="#3A1E0D" stroke-width="2.2" />
      <!-- Gagang Kuas Kayu Panjang -->
      <line x1="148" y1="112" x2="178" y2="52" stroke="#78350F" stroke-width="4.5" stroke-linecap="round" />
      <!-- Cincin Logam Kuas -->
      <line x1="174" y1="60" x2="180" y2="48" stroke="#D1D5DB" stroke-width="5.5" stroke-linecap="round" />
      <!-- Bulu Kuas Bersaput Cat Emas/Merah -->
      <path d="M 178 52 Q 186 36 190 32 Q 184 46 174 58 Z" fill="#F59E0B" stroke="#3A1E0D" stroke-width="1.8" />
      <!-- Tetesan Cat Kreatif -->
      <circle cx="192" cy="28" r="2.5" fill="#F59E0B" />
      <circle cx="186" cy="22" r="1.5" fill="#EF4444" />
    </g>

    <!-- LEHER & KALUNG -->
    <rect x="88" y="104" width="24" height="12" rx="6" fill="url(#baworSkin4)" />
    <path d="M 80 110 Q 100 120 120 110" stroke="url(#goldTrim4)" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- KEPALA & WAJAH -->
    <ellipse cx="100" cy="74" rx="44" ry="40" fill="url(#baworSkin4)" stroke="#3A1E0D" stroke-width="3" />

    <!-- PIPI -->
    <ellipse cx="68" cy="85" rx="9" ry="6" fill="#F87171" opacity="0.65" />
    <ellipse cx="132" cy="85" rx="9" ry="6" fill="#F87171" opacity="0.65" />

    <!-- TELINGA & ANTING -->
    <ellipse cx="56" cy="74" rx="7" ry="10" fill="url(#baworSkin4)" stroke="#3A1E0D" stroke-width="2.5" />
    <circle cx="56" cy="81" r="3.5" fill="url(#goldTrim4)" stroke="#3A1E0D" stroke-width="1.2" />
    <ellipse cx="144" cy="74" rx="7" ry="10" fill="url(#baworSkin4)" stroke="#3A1E0D" stroke-width="2.5" />
    <circle cx="144" cy="81" r="3.5" fill="url(#goldTrim4)" stroke="#3A1E0D" stroke-width="1.2" />

    <!-- MATA KREATIF ANTUSIAS -->
    <!-- Mata Kiri -->
    <ellipse cx="80" cy="66" rx="10" ry="11" fill="#FFFFFF" stroke="#3A1E0D" stroke-width="2.5" />
    <circle cx="82" cy="66" r="6" fill="#2E170A" />
    <circle cx="80" cy="63" r="2.5" fill="#FFFFFF" />
    <path d="M 68 53 Q 80 48 92 53" stroke="#3A1E0D" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Mata Kanan Melirik Kuas -->
    <ellipse cx="120" cy="66" rx="10" ry="11" fill="#FFFFFF" stroke="#3A1E0D" stroke-width="2.5" />
    <circle cx="123" cy="65" r="6" fill="#2E170A" />
    <circle cx="122" cy="62" r="2.5" fill="#FFFFFF" />
    <path d="M 108 53 Q 120 48 132 53" stroke="#3A1E0D" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- HIDUNG -->
    <path d="M 94 72 C 94 65 106 65 106 72 C 106 79 94 79 94 72 Z" fill="#E89658" stroke="#3A1E0D" stroke-width="2.2" />
    <ellipse cx="98" cy="70" rx="2" ry="1.2" fill="#FFFFFF" opacity="0.6" />

    <!-- SENYUM KREATIF TERSENYUM MANIS -->
    <path d="M 78 84 Q 100 108 122 84 Q 100 89 78 84 Z" fill="#991B1B" stroke="#3A1E0D" stroke-width="2.5" />
    <path d="M 84 85 Q 100 89 116 85 Q 100 87 84 85 Z" fill="#FFFFFF" />
    <path d="M 90 97 Q 100 91 110 97 Q 100 105 90 97 Z" fill="#F43F5E" />

    <!-- UDENG & RAMBUT KUNCUNG -->
    <path d="M 58 50 Q 100 32 142 50 Q 146 60 138 60 Q 100 42 62 60 Q 54 60 58 50 Z" fill="url(#udengBawor4)" stroke="#3A1E0D" stroke-width="2.5" />
    <circle cx="144" cy="52" r="9" fill="#3A1E0D" />
    <path d="M 70 48 Q 100 38 130 48" stroke="url(#goldTrim4)" stroke-width="2.2" fill="none" stroke-dasharray="3,2" />
    <polygon points="96,38 104,38 102,46 98,46" fill="#FDE68A" stroke="#3A1E0D" stroke-width="1.2" />

    <path d="M 96 36 C 92 20 104 10 112 14 C 118 17 114 26 104 36 Z" fill="#1C1008" stroke="#3A1E0D" stroke-width="2.2" />
    <path d="M 100 28 Q 106 18 110 20" stroke="#784719" stroke-width="1.5" fill="none" stroke-linecap="round" />
  </g>
</svg>
