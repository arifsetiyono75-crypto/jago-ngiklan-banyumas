<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="100%" height="100%" role="img" aria-label="Kang Bawor Senang Melompat">
  <defs>
    <radialGradient id="baworSkin6" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFDEB5" />
      <stop offset="60%" stop-color="#F5B888" />
      <stop offset="100%" stop-color="#D98A52" />
    </radialGradient>
    <radialGradient id="baworBelly6" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FCD29F" />
      <stop offset="70%" stop-color="#EAA26A" />
      <stop offset="100%" stop-color="#C27339" />
    </radialGradient>
    <linearGradient id="udengBawor6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5C3A21" />
      <stop offset="50%" stop-color="#784719" />
      <stop offset="100%" stop-color="#3A1E0D" />
    </linearGradient>
    <linearGradient id="goldTrim6" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="baworShadow6" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#3A1E0D" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#baworShadow6)">
    <!-- BAYANGAN TANAH (LEBIH KECIL KARENA MELOMPAT) -->
    <ellipse cx="100" cy="212" rx="42" ry="6" fill="#3A1E0D" opacity="0.18" />

    <!-- KAKI MELOMPAT DI UDARA -->
    <ellipse cx="76" cy="186" rx="14" ry="10" fill="url(#baworSkin6)" stroke="#3A1E0D" stroke-width="2.5" transform="rotate(-15 76 186)" />
    <ellipse cx="124" cy="186" rx="14" ry="10" fill="url(#baworSkin6)" stroke="#3A1E0D" stroke-width="2.5" transform="rotate(15 124 186)" />
    <circle cx="68" cy="186" r="3" fill="#D98A52" />
    <circle cx="132" cy="186" r="3" fill="#D98A52" />

    <!-- KAIN JARIK BERKIBAR CERIA -->
    <path d="M 62 140 Q 100 148 138 140 L 144 178 Q 100 190 56 178 Z" fill="url(#udengBawor6)" stroke="#3A1E0D" stroke-width="2.5" />
    <path d="M 72 150 Q 88 162 80 176" stroke="url(#goldTrim6)" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M 98 148 Q 112 160 104 177" stroke="url(#goldTrim6)" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M 122 152 Q 134 164 128 176" stroke="url(#goldTrim6)" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M 62 140 Q 100 148 138 140 L 138 147 Q 100 155 62 147 Z" fill="url(#goldTrim6)" stroke="#3A1E0D" stroke-width="2" />
    <circle cx="100" cy="146" r="5" fill="#EF4444" stroke="#78350F" stroke-width="1.5" />

    <!-- BADAN GEMUK MELAMBUNG -->
    <ellipse cx="100" cy="126" rx="42" ry="34" fill="url(#baworBelly6)" stroke="#3A1E0D" stroke-width="3" />
    <ellipse cx="100" cy="132" rx="3.5" ry="2.5" fill="#A85724" />

    <!-- ROMPI KAIN SOGA -->
    <path d="M 64 104 Q 78 120 72 140 Q 62 130 60 114 Z" fill="url(#udengBawor6)" stroke="#3A1E0D" stroke-width="2" />
    <path d="M 136 104 Q 122 120 128 140 Q 138 130 140 114 Z" fill="url(#udengBawor6)" stroke="#3A1E0D" stroke-width="2" />

    <!-- DUA TANGAN KE ATAS GEMBIRA MELOMPAT (YES! HORE!) -->
    <!-- Tangan Kiri -->
    <g id="tangan-kiri-hore">
      <path d="M 62 108 Q 36 94 40 70 Q 50 68 58 84" stroke="#3A1E0D" stroke-width="8" stroke-linecap="round" fill="none" />
      <path d="M 62 108 Q 36 94 40 70 Q 50 68 58 84" stroke="url(#baworSkin6)" stroke-width="5" stroke-linecap="round" fill="none" />
      <circle cx="40" cy="66" r="8" fill="url(#baworSkin6)" stroke="#3A1E0D" stroke-width="2.2" />
      <!-- Jari terbuka melambai gembira -->
      <line x1="34" y1="60" x2="32" y2="52" stroke="#3A1E0D" stroke-width="2.5" stroke-linecap="round" />
      <line x1="40" y1="58" x2="40" y2="50" stroke="#3A1E0D" stroke-width="2.5" stroke-linecap="round" />
      <line x1="46" y1="60" x2="48" y2="52" stroke="#3A1E0D" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Tangan Kanan -->
    <g id="tangan-kanan-hore">
      <path d="M 138 108 Q 164 94 160 70 Q 150 68 142 84" stroke="#3A1E0D" stroke-width="8" stroke-linecap="round" fill="none" />
      <path d="M 138 108 Q 164 94 160 70 Q 150 68 142 84" stroke="url(#baworSkin6)" stroke-width="5" stroke-linecap="round" fill="none" />
      <circle cx="160" cy="66" r="8" fill="url(#baworSkin6)" stroke="#3A1E0D" stroke-width="2.2" />
      <!-- Jari terbuka -->
      <line x1="154" y1="60" x2="152" y2="52" stroke="#3A1E0D" stroke-width="2.5" stroke-linecap="round" />
      <line x1="160" y1="58" x2="160" y2="50" stroke="#3A1E0D" stroke-width="2.5" stroke-linecap="round" />
      <line x1="166" y1="60" x2="168" y2="52" stroke="#3A1E0D" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- LEHER & KALUNG -->
    <rect x="88" y="92" width="24" height="12" rx="6" fill="url(#baworSkin6)" />
    <path d="M 80 98 Q 100 108 120 98" stroke="url(#goldTrim6)" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- KEPALA & WAJAH -->
    <ellipse cx="100" cy="62" rx="44" ry="40" fill="url(#baworSkin6)" stroke="#3A1E0D" stroke-width="3" />

    <!-- PIPI -->
    <ellipse cx="68" cy="73" rx="9" ry="6" fill="#F87171" opacity="0.75" />
    <ellipse cx="132" cy="73" rx="9" ry="6" fill="#F87171" opacity="0.75" />

    <!-- TELINGA & ANTING -->
    <ellipse cx="56" cy="62" rx="7" ry="10" fill="url(#baworSkin6)" stroke="#3A1E0D" stroke-width="2.5" />
    <circle cx="56" cy="69" r="3.5" fill="url(#goldTrim6)" stroke="#3A1E0D" stroke-width="1.2" />
    <ellipse cx="144" cy="62" rx="7" ry="10" fill="url(#baworSkin6)" stroke="#3A1E0D" stroke-width="2.5" />
    <circle cx="144" cy="69" r="3.5" fill="url(#goldTrim6)" stroke="#3A1E0D" stroke-width="1.2" />

    <!-- MATA SENANG MELOMPAT (BINTANG TAWA GEMBIRA) -->
    <path d="M 72 56 Q 80 46 88 56" stroke="#3A1E0D" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M 68 42 Q 80 36 92 42" stroke="#3A1E0D" stroke-width="3" stroke-linecap="round" fill="none" />

    <path d="M 112 56 Q 120 46 128 56" stroke="#3A1E0D" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M 108 42 Q 120 36 132 42" stroke="#3A1E0D" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- HIDUNG -->
    <path d="M 94 60 C 94 53 106 53 106 60 C 106 67 94 67 94 60 Z" fill="#E89658" stroke="#3A1E0D" stroke-width="2.2" />
    <ellipse cx="98" cy="58" rx="2" ry="1.2" fill="#FFFFFF" opacity="0.6" />

    <!-- SENYUM TERTAWA LEBAR GEMBIRA ("BENER BANGET, TOP MARKOTOP!") -->
    <path d="M 74 72 Q 100 102 126 72 Q 100 78 74 72 Z" fill="#991B1B" stroke="#3A1E0D" stroke-width="2.5" />
    <path d="M 82 73 Q 100 78 118 73 Q 100 76 82 73 Z" fill="#FFFFFF" />
    <path d="M 86 86 Q 100 80 114 86 Q 100 96 86 86 Z" fill="#F43F5E" />

    <!-- UDENG & RAMBUT KUNCUNG -->
    <path d="M 58 38 Q 100 20 142 38 Q 146 48 138 48 Q 100 30 62 48 Q 54 48 58 38 Z" fill="url(#udengBawor6)" stroke="#3A1E0D" stroke-width="2.5" />
    <circle cx="144" cy="40" r="9" fill="#3A1E0D" />
    <path d="M 70 36 Q 100 26 130 36" stroke="url(#goldTrim6)" stroke-width="2.2" fill="none" stroke-dasharray="3,2" />
    <polygon points="96,26 104,26 102,34 98,34" fill="#FDE68A" stroke="#3A1E0D" stroke-width="1.2" />

    <path d="M 96 24 C 92 8 104 -2 112 2 C 118 5 114 14 104 24 Z" fill="#1C1008" stroke="#3A1E0D" stroke-width="2.2" />
    <path d="M 100 16 Q 106 6 110 8" stroke="#784719" stroke-width="1.5" fill="none" stroke-linecap="round" />

    <!-- BINTANG-BINTANG KILAU KEBERHASILAN KARTUN -->
    <polygon points="32,36 34,42 40,42 35,46 37,52 32,48 27,52 29,46 24,42 30,42" fill="#F59E0B" />
    <polygon points="168,36 170,42 176,42 171,46 173,52 168,48 163,52 165,46 160,42 166,42" fill="#F59E0B" />
    <circle cx="24" cy="28" r="2.5" fill="#EF4444" />
    <circle cx="178" cy="28" r="2.5" fill="#10B981" />
  </g>
</svg>
