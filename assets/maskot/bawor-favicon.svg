<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" role="img" aria-label="Favicon Kang Bawor">
  <defs>
    <radialGradient id="favSkin" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFDEB5" />
      <stop offset="60%" stop-color="#F5B888" />
      <stop offset="100%" stop-color="#D98A52" />
    </radialGradient>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="favUdeng" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5C3A21" />
      <stop offset="100%" stop-color="#2D1508" />
    </linearGradient>
  </defs>

  <!-- Latar Lingkaran Emas Banyumasan -->
  <circle cx="32" cy="32" r="30" fill="url(#favGold)" stroke="#3A1E0D" stroke-width="2" />
  <circle cx="32" cy="32" r="27" fill="#FFFDF9" />

  <!-- Kepala & Wajah Kang Bawor -->
  <ellipse cx="32" cy="34" rx="20" ry="18" fill="url(#favSkin)" stroke="#3A1E0D" stroke-width="2" />

  <!-- Pipi Merona -->
  <circle cx="18" cy="39" r="4" fill="#F87171" opacity="0.65" />
  <circle cx="46" cy="39" r="4" fill="#F87171" opacity="0.65" />

  <!-- Mata Bulat Ceria -->
  <ellipse cx="23" cy="31" rx="4.5" ry="5.5" fill="#FFFFFF" stroke="#3A1E0D" stroke-width="1.5" />
  <circle cx="23" cy="31" r="3" fill="#2E170A" />
  <circle cx="22" cy="29.5" r="1.2" fill="#FFFFFF" />

  <ellipse cx="41" cy="31" rx="4.5" ry="5.5" fill="#FFFFFF" stroke="#3A1E0D" stroke-width="1.5" />
  <circle cx="41" cy="31" r="3" fill="#2E170A" />
  <circle cx="40" cy="29.5" r="1.2" fill="#FFFFFF" />

  <!-- Alis -->
  <path d="M 18 24 Q 23 21 28 24" stroke="#3A1E0D" stroke-width="1.8" stroke-linecap="round" fill="none" />
  <path d="M 36 24 Q 41 21 46 24" stroke="#3A1E0D" stroke-width="1.8" stroke-linecap="round" fill="none" />

  <!-- Hidung Bulat -->
  <circle cx="32" cy="34" r="3.2" fill="#E89658" stroke="#3A1E0D" stroke-width="1.4" />

  <!-- Senyum Lebar Tawa -->
  <path d="M 21 40 Q 32 51 43 40 Q 32 44 21 40 Z" fill="#991B1B" stroke="#3A1E0D" stroke-width="1.5" />
  <path d="M 25 41 Q 32 44 39 41 Q 32 42 25 41 Z" fill="#FFFFFF" />
  <path d="M 28 46 Q 32 43 36 46 Q 32 50 28 46 Z" fill="#F43F5E" />

  <!-- Udeng Batik Soga & Kuncung -->
  <path d="M 14 23 Q 32 15 50 23 Q 48 27 44 27 Q 32 20 20 27 Z" fill="url(#favUdeng)" stroke="#3A1E0D" stroke-width="1.5" />
  <circle cx="51" cy="23" r="4" fill="#3A1E0D" />
  <path d="M 30 17 C 28 9 34 4 37 6 C 40 8 38 13 34 17 Z" fill="#1C1008" stroke="#3A1E0D" stroke-width="1.4" />
</svg>
