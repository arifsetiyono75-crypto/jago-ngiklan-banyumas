  <circle cx="134" cy="253" r="9" fill="#F59E0B" stroke="#3A1E0D" stroke-width="3" />
  <ellipse cx="378" cy="235" rx="19" ry="26" fill="url(#baworSkin512)" stroke="#3A1E0D" stroke-width="6.5" />
  <circle cx="378" cy="253" r="9" fill="#F59E0B" stroke="#3A1E0D" stroke-width="3" />

