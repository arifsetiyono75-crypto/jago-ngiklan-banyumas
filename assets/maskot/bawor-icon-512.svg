  <!-- Pita Banner Judul Bawah -->
  <rect x="96" y="416" width="320" height="58" rx="29" fill="#5C3A21" stroke="#F59E0B" stroke-width="5" />
  <text x="256" y="454" font-family="'Poppins', sans-serif" font-weight="900" font-size="24" fill="#FFFBEB" text-anchor="middle" letter-spacing="3">KANG BAWOR</text>
