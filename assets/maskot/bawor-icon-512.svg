      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="70%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </radialGradient>
    <linearGradient id="iconRim512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#5C3A21" />
      <stop offset="100%" stop-color="#2D1508" />
